# A generic, single database configuration.

[alembic]
# path to migration scripts — overridden programmatically at runtime via set_main_option
script_location = alembic

# date-prefixed revision filenames for readability
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path is prepended with this path when 'env.py' is executed
prepend_sys_path = .

version_path_separator = os

# URL is injected programmatically in env.py — do not put credentials here
sqlalchemy.url =


[post_write_hooks]
# hooks to run after generating new revision scripts

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
