
volumes:
  timescaledb_data:
  
services: 

  # # Jaeger
  # jaeger-all-in-one:
  #   image: jaegertracing/all-in-one:latest
  #   restart: always
  #   ports:
  #     - "16686:16686"
  #     - "14268"
  #     - "14250"


  vector:
    image: timberio/vector:0.54.0-alpine
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8686/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
#    ports:
#      - "0.0.0.0:4317:4317"   # OTLP gRPC receiver
#      - "0.0.0.0:4318:4318"   # OTLP http/protobuf receiver
#      - 8686:8686
    volumes:
      - ../config/analytics/vector.yml:/etc/vector/vector.yaml:ro
    env_file:
      - .envs-analytics
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
    restart: always

  analytics-migrate:
    build:
      context: ../analytics-cli
      target: dev
    image: georchestra/analytics-cli:${ANALYTICS_CLI_VERSION:-2.2.0}
    command: ["analytics-cli", "--config-file", "/etc/georchestra/analytics/cli.yaml", "db", "upgrade"]
    env_file:
      - .envs-analytics
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ../analytics-cli/config/analytics_cli.yaml:/etc/georchestra/analytics/cli.yaml:ro
    restart: "no"

  analytics-cli:
    image: georchestra/analytics-cli:${ANALYTICS_CLI_VERSION:-2.2.0}
    command: ["analytics-cli", "--config-file", "/etc/georchestra/analytics/cli.yaml", "buffer2db", "--cron", "5 0 * * *"]
    env_file:
      - .envs-analytics
    depends_on:
      analytics-migrate:
        condition: service_completed_successfully
      vector:
        condition: service_healthy
    volumes:
      - ../analytics-cli/config/analytics_cli.yaml:/etc/georchestra/analytics/cli.yaml:ro
    restart: always

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    ports:
      - "${TSDB_PUBLISHED_PORT:-5433}:5432"
    env_file:
      - .envs-analytics
#    environment:
#      - POSTGRES_DB=analytics
#      - POSTGRES_USER=tsdb
#      - POSTGRES_PASSWORD=password
    volumes:
      - timescaledb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
