
volumes:
  timescaledb_home_data:
  timescaledb_home_log:
  
services: 

  # # Jaeger
  # jaeger-all-in-one:
  #   image: jaegertracing/all-in-one:latest
  #   restart: always
  #   ports:
  #     - "16686:16686"
  #     - "14268"
  #     - "14250"


  vector:
    image: timberio/vector:0.54.0-alpine
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8686/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
#    ports:
#      - "0.0.0.0:4317:4317"   # OTLP gRPC receiver
#      - "0.0.0.0:4318:4318"   # OTLP http/protobuf receiver
#      - 8686:8686
    volumes:
      - ./config/analytics/vector.yml:/etc/vector/vector.yaml:ro
    env_file:
      - .envs-analytics
    restart: always

  timescaledb:
    image: timescale/timescaledb-ha:pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsdb -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - 5433:5432
    env_file:
      - .envs-analytics
#    environment:
#      - POSTGRES_DB=analytics
#      - POSTGRES_USER=tsdb
#      - POSTGRES_PASSWORD=password
    volumes:
      - timescaledb_home_data:/home/postgres/pgdata
      - timescaledb_home_log:/home/postgres/pg_log
      - ./config/analytics/db.entrypoints.d:/docker-entrypoint-initdb.d/:ro
    restart: always

  analytics-cli:
    image: georchestra/analytics-cli:2.1.0
    volumes:
      - ./config:/etc/georchestra
    env_file:
       - .envs-analytics
    command: ["/bin/bash", "-c", 'analytics-cli --config-file /etc/georchestra/analytics/config/config.yaml buffer2db --cron "5 0 * * *"']
    depends_on:
      - vector
      - timescaledb
    restart: always
