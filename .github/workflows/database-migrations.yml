name: Database migration tests

on:
  pull_request:
    paths:
      - "analytics-cli/**"
      - "config/analytics/db.entrypoints.d/**"
      - "tests/migrations/**"
      - "tools/database-migrations/**"
      - "Makefile"
      - ".github/workflows/database-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "analytics-cli/**"
      - "config/analytics/db.entrypoints.d/**"
      - "tests/migrations/**"
      - "tools/database-migrations/**"
      - "Makefile"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

jobs:
  migration-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics-cli/setup.cfg

      - name: Install analytics CLI
        run: pip install -e './analytics-cli[testing]'

      - name: Validate migration fixtures and scenarios
        run: make test-migrations-all
